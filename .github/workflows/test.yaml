name: Deploy Application

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Select deployment environment"
        required: true
        type: choice
        options:
          - development
          - staging
          - production
      vault:
        description: "Enter vault number"
        required: false
        type: number
        default: 10


jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Show selected environment
        run: echo "Deployingg to ${{ inputs.environment }}"
  example:
    runs-on: ubuntu-latest
    steps:
      - name: Display vault number
        run: echo "Vault number is ${{ inputs.vault }}"
